<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Luxury Gold Linear Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Deep Luxury Black Background -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#181a24" />
      <stop offset="100%" stop-color="#07080b" />
    </radialGradient>

    <!-- Glowing Drop Shadow -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#f59e0b" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Base Circle/Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.4" />

  <!-- Outer Diamond Shield Emblem (45deg rotated) -->
  <g transform="translate(256, 256)">
    <!-- Rotating Diamond Frame -->
    <rect x="-140" y="-140" width="280" height="280" rx="36" transform="rotate(45)" fill="url(#goldGrad)" filter="url(#goldGlow)" />
    
    <!-- Inner Dark Core -->
    <rect x="-124" y="-124" width="248" height="248" rx="30" transform="rotate(45)" fill="#0b0c10" />

    <!-- Subtle Inner Gold Border -->
    <rect x="-114" y="-114" width="228" height="228" rx="24" transform="rotate(45)" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.6" />

    <!-- Corner Timepiece Markers -->
    <circle cx="0" cy="-172" r="6" fill="#fcd34d" />
    <circle cx="172" cy="0" r="6" fill="#fcd34d" />
    <circle cx="0" cy="172" r="6" fill="#fcd34d" />
    <circle cx="-172" cy="0" r="6" fill="#fcd34d" />

    <!-- Blackora Iconic Serif 'B' Monogram -->
    <text
      x="0"
      y="76"
      text-anchor="middle"
      fill="url(#goldGrad)"
      font-family="'Cinzel', 'Times New Roman', 'Georgia', serif"
      font-size="220"
      font-weight="900"
      letter-spacing="-4"
      filter="drop-shadow(0px 4px 12px rgba(245, 158, 11, 0.4))"
    >B</text>
  </g>
</svg>
